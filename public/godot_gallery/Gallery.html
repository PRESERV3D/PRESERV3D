<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0" />
    <title>preserv3d</title>
    <style>
      html,
      body,
      #canvas {
        margin: 0;
        padding: 0;
        border: 0;
      }

      body {
        color: white;
        background-color: black;
        overflow: hidden;
        touch-action: none;
      }

      #canvas {
        display: block;
      }

      #canvas:focus {
        outline: none;
      }

      #status,
      #status-splash,
      #status-progress {
        position: absolute;
        left: 0;
        right: 0;
      }

      #status,
      #status-splash {
        top: 0;
        bottom: 0;
      }

      #status {
        background-color: #242424;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        visibility: hidden;
      }

      #status-splash {
        max-height: 100%;
        max-width: 100%;
        margin: auto;
      }

      #status-splash.show-image--false {
        display: none;
      }

      #status-splash.fullsize--true {
        height: 100%;
        width: 100%;
        object-fit: contain;
      }

      #status-splash.use-filter--false {
        image-rendering: pixelated;
      }

      #status-progress,
      #status-notice {
        display: none;
      }

      #status-progress {
        bottom: 10%;
        width: 50%;
        margin: 0 auto;
      }

      #status-notice {
        background-color: #5b3943;
        border-radius: 0.5rem;
        border: 1px solid #9b3943;
        color: #e0e0e0;
        font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
        line-height: 1.3;
        margin: 0 2rem;
        overflow: hidden;
        padding: 1rem;
        text-align: center;
        z-index: 1;
      }
    </style>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="Gallery.icon.png" />
    <link rel="apple-touch-icon" href="Gallery.apple-touch-icon.png" />
  </head>
  <body>
    <canvas id="canvas"> Your browser does not support the canvas tag. </canvas>

    <noscript> Your browser does not support JavaScript. </noscript>

    <div id="status">
      <img
        id="status-splash"
        class="show-image--true fullsize--true use-filter--true"
        src="Gallery.png"
        alt=""
      />
      <progress id="status-progress"></progress>
      <div id="status-notice"></div>
    </div>

    <script src="Gallery.js"></script>
    <script>
      const GODOT_CONFIG = {
        args: [],
        canvasResizePolicy: 2,
        ensureCrossOriginIsolationHeaders: true,
        executable: 'Gallery',
        experimentalVK: false,
        fileSizes: { 'Gallery.pck': 45232, 'Gallery.wasm': 52126319 },
        focusCanvas: true,
        gdextensionLibs: [],
      }
      const GODOT_THREADS_ENABLED = false
      const engine = new Engine(GODOT_CONFIG)

      // Global variables - declared at top level to avoid scoping issues
      let pendingModelUrls = null
      let godotInstance = null

      // Listen for messages from parent window (Vue component)
      window.addEventListener('message', function (event) {
        console.log('Received message from parent:', event.data)

        if (event.data.type === 'load_models' && event.data.urls) {
          pendingModelUrls = event.data.urls
          console.log('Stored model URLs for Godot:', pendingModelUrls)

          if (godotInstance) {
            sendUrlsToGodot()
          }
        } else if (event.data.type === 'load_model_data' && event.data.models) {
          // New data-based method (for cached models)
          console.log('Received model data from parent:', event.data.models)

          // Store the model data globally for Godot to access
          window.godotModelData = event.data.models

          if (godotInstance) {
            // Call a new Godot function to handle raw data
            try {
              godotInstance.rpc('set_model_data', event.data.models)
            } catch (error) {
              console.error('Failed to send model data to Godot:', error)
            }
          }
        }
      })

      function sendUrlsToGodot() {
        if (pendingModelUrls && godotInstance) {
          console.log('Sending URLs to Godot via RPC:', pendingModelUrls)
          try {
            // Store URLs in multiple places for Godot to access
            window.godotModelUrls = pendingModelUrls

            // Also store as a JSON string that might be easier for Godot to parse
            window.godotModelUrlsJson = JSON.stringify(pendingModelUrls)

            // Store in localStorage as another backup method
            try {
              localStorage.setItem('godotModelUrls', JSON.stringify(pendingModelUrls))
            } catch (e) {
              console.log('localStorage not available')
            }

            console.log('Model URLs stored in multiple locations for Godot to access')
            console.log('window.godotModelUrls:', window.godotModelUrls)
            console.log('window.godotModelUrlsJson:', window.godotModelUrlsJson)

            // Try to trigger a custom event that Godot might be able to detect
            window.dispatchEvent(
              new CustomEvent('godotModelUrlsReady', {
                detail: { urls: pendingModelUrls },
              }),
            )
          } catch (error) {
            console.error('Failed to send URLs to Godot:', error)
          }
        }
      }

      // Parse URL parameters as fallback
      function getModelUrlsFromParams() {
        const urlParams = new URLSearchParams(window.location.search)
        const modelsParam = urlParams.get('models')

        if (modelsParam) {
          try {
            return JSON.parse(decodeURIComponent(modelsParam))
          } catch (error) {
            console.error('Failed to parse models parameter:', error)
            return []
          }
        }
        return []
      }

      ;(function () {
        const statusOverlay = document.getElementById('status')
        const statusProgress = document.getElementById('status-progress')
        const statusNotice = document.getElementById('status-notice')

        let initializing = true
        let statusMode = ''

        function setStatusMode(mode) {
          if (statusMode === mode || !initializing) {
            return
          }
          if (mode === 'hidden') {
            statusOverlay.remove()
            initializing = false
            return
          }
          statusOverlay.style.visibility = 'visible'
          statusProgress.style.display = mode === 'progress' ? 'block' : 'none'
          statusNotice.style.display = mode === 'notice' ? 'block' : 'none'
          statusMode = mode
        }

        function setStatusNotice(text) {
          while (statusNotice.lastChild) {
            statusNotice.removeChild(statusNotice.lastChild)
          }
          const lines = text.split('\n')
          lines.forEach((line) => {
            statusNotice.appendChild(document.createTextNode(line))
            statusNotice.appendChild(document.createElement('br'))
          })
        }

        function displayFailureNotice(err) {
          console.error(err)
          if (err instanceof Error) {
            setStatusNotice(err.message)
          } else if (typeof err === 'string') {
            setStatusNotice(err)
          } else {
            setStatusNotice('An unknown error occurred.')
          }
          setStatusMode('notice')
          initializing = false
        }

        const missing = Engine.getMissingFeatures({
          threads: GODOT_THREADS_ENABLED,
        })

        if (missing.length !== 0) {
          if (
            GODOT_CONFIG['serviceWorker'] &&
            GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] &&
            'serviceWorker' in navigator
          ) {
            let serviceWorkerRegistrationPromise
            try {
              serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration()
            } catch (err) {
              serviceWorkerRegistrationPromise = Promise.reject(
                new Error('Service worker registration failed.'),
              )
            }
            // There's a chance that installing the service worker would fix the issue
            Promise.race([
              serviceWorkerRegistrationPromise
                .then((registration) => {
                  if (registration != null) {
                    return Promise.reject(new Error('Service worker already exists.'))
                  }
                  return registration
                })
                .then(() => engine.installServiceWorker()),
              // For some reason, `getRegistration()` can stall
              new Promise((resolve) => {
                setTimeout(() => resolve(), 2000)
              }),
            ])
              .then(() => {
                // Reload if there was no error.
                window.location.reload()
              })
              .catch((err) => {
                console.error('Error while registering service worker:', err)
              })
          } else {
            // Display the message as usual
            const missingMsg =
              'Error\nThe following features required to run Godot projects on the Web are missing:\n'
            displayFailureNotice(missingMsg + missing.join('\n'))
          }
        } else {
          setStatusMode('progress')
          engine
            .startGame({
              onProgress: function (current, total) {
                if (current > 0 && total > 0) {
                  statusProgress.value = current
                  statusProgress.max = total
                } else {
                  statusProgress.removeAttribute('value')
                  statusProgress.removeAttribute('max')
                }
              },
            })
            .then(() => {
              setStatusMode('hidden')

              // Store the Godot instance for RPC calls
              godotInstance = engine
              console.log('Godot engine loaded successfully')

              // If we have pending URLs from postMessage, send them now
              if (pendingModelUrls) {
                console.log('Found pending URLs, sending to Godot:', pendingModelUrls)
                sendUrlsToGodot()
              } else {
                // Fallback: try to get URLs from URL parameters
                console.log('No pending URLs, checking URL parameters...')
                const urlModelUrls = getModelUrlsFromParams()
                if (urlModelUrls.length > 0) {
                  console.log('Found URLs in parameters:', urlModelUrls)
                  pendingModelUrls = urlModelUrls
                  sendUrlsToGodot()
                } else {
                  console.log('No URLs found in parameters either')
                }
              }
            }, displayFailureNotice)
        }
      })()
    </script>
  </body>
</html>

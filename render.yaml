services:
  - type: web
    name: preserv3d-nlp-service
    env: python
    region: singapore
    plan: free
    rootDir: services
    buildCommand: |
      set -e
      echo "========== Starting build process =========="

      # Install Python dependencies
      echo "Installing Python dependencies..."
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm

      # Install Node.js and system dependencies
      echo "Installing Node.js and system dependencies..."
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get update
      apt-get install -y nodejs chromium chromium-sandbox fonts-liberation libnss3 libxss1 libasound2

      echo "Node.js version: $(node --version)"
      echo "npm version: $(npm --version)"

      # Verify package.json exists
      if [ ! -f "package.json" ]; then
        echo "ERROR: package.json not found in $(pwd)"
        ls -la
        exit 1
      fi

      # Install Node.js dependencies during build
      echo "Installing Node.js dependencies..."
      npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # Verify critical packages are installed
      if [ ! -d "node_modules/puppeteer-extra" ]; then
        echo "ERROR: puppeteer-extra not found after npm install"
        exit 1
      fi

      echo "Node modules installed at: $(pwd)/node_modules"
      ls -la node_modules/ | head -20

      echo "========== Build completed successfully =========="

    startCommand: |
      echo "Starting service from: $(pwd)" && \
      echo "Checking node_modules..." && \
      ls -la node_modules/puppeteer* 2>/dev/null || echo "WARNING: puppeteer modules not found, reinstalling..." && \
      [ ! -d "node_modules/puppeteer-extra" ] && npm install --legacy-peer-deps --prefer-offline || true && \
      uvicorn nlp_service:app --host 0.0.0.0 --port ${PORT:-8000}

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: NODE_VERSION
        value: 20.18.1
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://preserv3d.vercel.app
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: 'true'
      - key: NODE_ENV
        value: production
      - key: NODE_PATH
        value: /opt/render/project/src/services/node_modules

services:
  - type: web
    name: preserv3d-nlp-service
    env: python
    region: singapore
    plan: free
    rootDir: services
    # Optimized build: use --no-cache-dir to reduce memory, split commands
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: uvicorn nlp_service:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1
    # System packages - Render will install these with proper permissions
    nativeEnvironments:
      - name: python
        version: 3.11.7

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://preserv3d.vercel.app
      - key: NODE_ENV
        value: production
      # Optimize for memory on free tier
      - key: TRANSFORMERS_CACHE
        value: /opt/render/project/.cache
      - key: HF_HOME
        value: /opt/render/project/.cache

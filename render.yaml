services:
  - type: web
    name: preserv3d-nlp-service
    env: python
    region: singapore
    plan: free
    rootDir: services
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm && npm install --legacy-peer-deps
    startCommand: uvicorn nlp_service:app --host 0.0.0.0 --port ${PORT:-8000}

    # System packages - Render will install these with proper permissions
    nativeEnvironments:
      - name: python
        version: 3.11.7
      - name: node
        version: 20.18.1

    # These get installed automatically by Render
    systemPackages:
      - chromium
      - chromium-sandbox
      - fonts-liberation
      - libnss3
      - libxss1
      - libasound2

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: NODE_VERSION
        value: 20.18.1
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://preserv3d.vercel.app
      - key: NODE_ENV
        value: production

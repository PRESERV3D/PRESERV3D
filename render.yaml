services:
  - type: web
    name: preserv3d-nlp-service
    env: python
    region: singapore
    plan: free
    rootDir: services
    buildCommand: |
      set -e
      echo "========== Starting build process =========="
      
      # Install Python dependencies
      echo "Installing Python dependencies..."
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm

      # Install Node.js and system dependencies
      echo "Installing Node.js and system dependencies..."
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get update
      apt-get install -y nodejs chromium chromium-sandbox fonts-liberation libnss3 libxss1 libasound2

      echo "Node.js version: $(node --version)"
      echo "npm version: $(npm --version)"

      # Create a script that will install node modules at startup
      cat > install_node_deps.sh << 'SCRIPT'
#!/bin/bash
set -e

echo "Checking node_modules..."
if [ ! -d "node_modules" ] || [ ! -d "node_modules/puppeteer-extra" ]; then
    echo "Installing Node.js dependencies..."
    npm install --legacy-peer-deps --prefer-offline
    echo "Node.js dependencies installed successfully"
else
    echo "Node.js dependencies already installed"
fi
SCRIPT
      chmod +x install_node_deps.sh

      echo "========== Build completed successfully =========="

    startCommand: |
      ./install_node_deps.sh && \
      uvicorn nlp_service:app --host 0.0.0.0 --port ${PORT:-8000}
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: NODE_VERSION
        value: 20.18.1
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://preserv3d.vercel.app
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: 'true'
      - key: NODE_ENV
        value: production